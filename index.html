<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AIMario — 超级马里奥兄弟 3 风格复刻</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #101018;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #cfd2e0;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #app {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
    }
    /* 像素风的关键：整数倍放大 + 关闭插值 */
    #screen {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border-radius: 2px;
      box-shadow: 0 0 0 2px #2b2f42, 0 18px 50px rgba(0, 0, 0, .75);
    }
    #bar {
      display: flex; align-items: center; gap: 14px;
      font-size: 12px; letter-spacing: .3px; color: #7f86a3;
    }
    #bar b { color: #b9c0dc; font-weight: 600; }
    #bar kbd {
      display: inline-block; min-width: 16px; text-align: center;
      padding: 1px 5px; margin: 0 1px;
      border: 1px solid #3b4160; border-bottom-width: 2px; border-radius: 3px;
      background: #1c2033; color: #d5daf0; font-size: 11px; font-family: inherit;
    }
    #bar button {
      font: inherit; font-size: 11px; color: #cfd2e0; cursor: pointer;
      background: #1c2033; border: 1px solid #3b4160; border-radius: 3px; padding: 3px 9px;
    }
    #bar button:hover { background: #262c45; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #101018; font-size: 13px; color: #8b93b5; z-index: 10;
    }
    #boot.hidden { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="screen" width="256" height="224"></canvas>
    <div id="bar">
      <span><b>移动</b> <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd></span>
      <span><b>跳</b> <kbd>Z</kbd>/<kbd>空格</kbd></span>
      <span><b>跑/攻击</b> <kbd>X</kbd></span>
      <span><b>暂停</b> <kbd>Enter</kbd></span>
      <span><b>调试</b> <kbd>F1</kbd></span>
      <button id="btn-mute" type="button">🔊 声音</button>
      <button id="btn-full" type="button">⛶ 全屏</button>
    </div>
  </div>
  <div id="boot">正在加载引擎…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
